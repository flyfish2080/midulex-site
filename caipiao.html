<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩票模型验证系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { max-width: 600px; width: 100%; }
.header { text-align: center; margin-bottom: 40px; }
.logo { width: 80px; height: 80px; background: linear-gradient(135deg, #e94560, #ff6b6b); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; box-shadow: 0 10px 40px rgba(233,69,96,0.4); }
h1 { color: #fff; font-size: 28px; margin-bottom: 8px; }
.subtitle { color: rgba(255,255,255,0.6); font-size: 14px; }
.entry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
.entry-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px 20px; text-align: center; cursor: pointer; transition: all 0.3s; text-decoration: none; display: block; }
.entry-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-4px); border-color: rgba(255,255,255,0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
.entry-icon { font-size: 48px; margin-bottom: 16px; }
.entry-name { color: #fff; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.entry-desc { color: rgba(255,255,255,0.5); font-size: 13px; }
.entry-rule { display: inline-block; margin-top: 12px; padding: 4px 12px; background: rgba(255,255,255,0.1); border-radius: 20px; font-size: 11px; color: rgba(255,255,255,0.7); }
.footer { text-align: center; color: rgba(255,255,255,0.3); font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🎰</div>
    <h1>彩票模型验证系统</h1>
    <p class="subtitle">选择要进入的系统</p>
  </div>

  <div class="entry-grid">
    <a href="/ssq.html" class="entry-card">
      <div class="entry-icon">🔴</div>
      <div class="entry-name">双色球</div>
      <div class="entry-desc">红6+蓝1 · 3497期回测</div>

    </a>
    <a href="/daletou.html" class="entry-card">
      <div class="entry-icon">🔵</div>
      <div class="entry-name">大乐透</div>
      <div class="entry-desc">前5+后2 · 3400期回测</div>
      <div class="entry-rule">选号范围 35+12</div>
    </a>
    <a href="/kuaile8.html" class="entry-card">
      <div class="entry-icon">🟢</div>
      <div class="entry-name">快乐8</div>
      <div class="entry-desc">选5中5 · 3500期回测</div>
      <div class="entry-rule">选号范围 80选5</div>
    </a>
  </div>

  <div class="footer"><a href="https://www.dmmmw.site/" style="color:rgba(255,255,255,0.5);text-decoration:none;">© 2026 米多乐享</a> · 仅供模型验证研究</div>
</div>

<style>
.float-ad{position:fixed;width:260px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:16px;padding:18px;color:#fff;box-shadow:0 10px 40px rgba(0,0,0,0.3);z-index:9999;}
.float-ad h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.float-ad p{font-size:12px;line-height:1.6;opacity:0.95;}
.float-ad .prize{display:inline-block;margin-top:8px;padding:3px 10px;background:#ffd700;color:#333;border-radius:20px;font-weight:bold;font-size:12px;}
.float-ad .close{position:absolute;top:6px;right:10px;cursor:pointer;opacity:0.6;font-size:16px;}
.float-ad .close:hover{opacity:1;}
@media(max-width:640px){.float-ad{width:220px;padding:14px;}}
</style>
<div class="float-ad" id="floatAd">
  <span class="close" onclick="document.getElementById('floatAd').style.display='none'">×</span>
  <h3>🏆 欢迎来挑战</h3>
  <p>你出方法，我建模型。模型盲试效果若超过随机投注效果，并且收益在训练集和测试集上都大于0，则奉送奖金 <span class="prize">10000元</span></p>
</div>
<script>
(function(){
  var ad = document.getElementById('floatAd');
  var w = window.innerWidth, h = window.innerHeight;
  var aw = ad.offsetWidth, ah = ad.offsetHeight;
  var x = Math.random() * (w - aw - 20), y = Math.random() * (h - ah - 20);
  var dx = 0.5 + Math.random()*0.5, dy = 0.5 + Math.random()*0.5;
  if(Math.random() < 0.5) dx = -dx;
  if(Math.random() < 0.5) dy = -dy;
  var timer = null;
  function start(){
    if(timer) return;
    timer = setInterval(function(){
      x += dx; y += dy;
      if(x <= 0 || x >= w - aw - 10) dx = -dx;
      if(y <= 0 || y >= h - ah - 10) dy = -dy;
      ad.style.left = x + 'px';
      ad.style.top = y + 'px';
    }, 30);
  }
  function stop(){
    if(timer){ clearInterval(timer); timer = null; }
  }
  ad.onmouseenter = stop;
  ad.onmouseleave = start;
  ad.style.left = x + 'px';
  ad.style.top = y + 'px';
  start();
})();
</script>
</body>
</html>

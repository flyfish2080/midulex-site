<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>彩票模型验证系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { max-width: 600px; width: 100%; }
.header { text-align: center; margin-bottom: 40px; }
.logo { width: 80px; height: 80px; background: linear-gradient(135deg, #e94560, #ff6b6b); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; box-shadow: 0 10px 40px rgba(233,69,96,0.4); }
h1 { color: #fff; font-size: 28px; margin-bottom: 8px; }
.subtitle { color: rgba(255,255,255,0.6); font-size: 14px; }
.entry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
.entry-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px 20px; text-align: center; cursor: pointer; transition: all 0.3s; text-decoration: none; display: block; }
.entry-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-4px); border-color: rgba(255,255,255,0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
.entry-icon { font-size: 48px; margin-bottom: 16px; }
.entry-name { color: #fff; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.entry-desc { color: rgba(255,255,255,0.5); font-size: 13px; }
.entry-rule { display: inline-block; margin-top: 12px; padding: 4px 12px; background: rgba(255,255,255,0.1); border-radius: 20px; font-size: 11px; color: rgba(255,255,255,0.7); }
.footer { text-align: center; color: rgba(255,255,255,0.3); font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🎰</div>
    <h1>彩票模型验证系统</h1>

    <a href="/kuaile8.html" class="entry-card">

  <div class="footer">© 2026 米多乐享 · 仅供模型验证研究</div>

</html>

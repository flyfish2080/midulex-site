<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家委会工作台 · 米多乐享科技</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f4fa;color:#1e2a5a;min-height:100vh;display:flex}
/* 侧边栏 */
.sidebar{width:220px;background:linear-gradient(180deg,#1e3a5f,#0f1f3a);color:#fff;min-height:100vh;position:fixed;left:0;top:0;overflow-y:auto;z-index:100}
.sidebar .brand{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1);text-align:center}
.sidebar .brand .logo{font-size:32px}
.sidebar .brand h1{font-size:15px;margin-top:8px;letter-spacing:1px}
.sidebar .brand .sub{font-size:11px;color:#8fa3bf;margin-top:4px}
.nav{padding:10px 0}
.nav-item{padding:11px 18px;cursor:pointer;font-size:13px;color:#c5d3e8;display:flex;align-items:center;gap:10px;transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(77,214,195,.12);color:#4dd6c3;border-left-color:#4dd6c3}
.nav-group{padding:8px 18px 4px;font-size:10px;color:#5b7399;text-transform:uppercase;letter-spacing:1px;margin-top:6px}
/* 主内容 */
.main{margin-left:220px;flex:1;padding:24px 28px;min-height:100vh}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-head h2{font-size:20px;color:#1e2a5a}
.page-head .desc{font-size:12px;color:#5b6b8c;margin-top:4px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.btn-ghost{background:#e2e8f0;color:#475569}
.btn-sm{padding:5px 10px;font-size:12px}
/* 卡片 */
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(30,42,90,.06);margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:#1e2a5a;margin-bottom:12px;display:flex;align-items:center;gap:8px}
/* 表格 */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f1f5f9;padding:10px 12px;text-align:left;font-weight:600;color:#475569;border-bottom:2px solid #e2e8f0;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;color:#33415c;vertical-align:top}
tr:hover td{background:#f8fafc}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#d1fae5;color:#065f46}
.tag-orange{background:#fed7aa;color:#9a3412}
.tag-red{background:#fee2e2;color:#991b1b}
.tag-gray{background:#e2e8f0;color:#475569}
.tag-purple{background:#ede9fe;color:#5b21b6}
/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px;color:#1e2a5a}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;line-height:1}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:10px}
/* 表单 */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;font-family:inherit;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-group textarea{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* 统计卡片 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 12px rgba(30,42,90,.06)}
.stat-card .stat-icon{font-size:24px}
.stat-card .stat-value{font-size:26px;font-weight:700;color:#1e2a5a;margin-top:6px}
.stat-card .stat-label{font-size:12px;color:#64748b;margin-top:2px}
/* 空状态 */
.empty{text-align:center;padding:40px 20px;color:#94a3b8;font-size:13px}
.empty .icon{font-size:40px;margin-bottom:10px}
/* 操作按钮 */
.actions{display:flex;gap:6px;flex-wrap:wrap}
/* 搜索栏 */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:7px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px}
.toolbar .spacer{flex:1}
/* 详情 */
.detail-list{font-size:13px}
.detail-list .row{display:flex;padding:8px 0;border-bottom:1px solid #f1f5f9}
.detail-list .row .k{width:100px;color:#64748b;flex-shrink:0}
.detail-list .row .v{flex:1;color:#1e2a5a;word-break:break-all}
/* 投票进度 */
.vote-bar{background:#e2e8f0;border-radius:4px;height:20px;position:relative;overflow:hidden;margin-top:4px}
.vote-bar .fill{background:linear-gradient(90deg,#2563eb,#4dd6c3);height:100%;transition:width .3s}
.vote-bar .pct{position:absolute;right:6px;top:0;line-height:20px;font-size:11px;color:#475569;font-weight:600}
/* 财务汇总 */
.finance-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.finance-box{padding:14px;border-radius:10px;text-align:center}
.finance-box.income{background:#d1fae5}
.finance-box.expense{background:#fee2e2}
.finance-box.balance{background:#dbeafe}
.finance-box .num{font-size:22px;font-weight:700}
.finance-box .lbl{font-size:12px;margin-top:2px}
/* 响应式 */
@media(max-width:768px){
  .sidebar{width:60px}
  .sidebar .brand h1,.sidebar .brand .sub,.nav-item span,.nav-group{display:none}
  .nav-item{justify-content:center;padding:12px 0}
  .main{margin-left:60px;padding:16px}
  .form-row{grid-template-columns:1fr}
  .finance-summary{grid-template-columns:1fr}
}
/* 打印 */
@media print{.sidebar,.btn,.toolbar{display:none}.main{margin-left:0}}

/* 课表 */
.schedule-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.schedule-table th{background:#1e3a5f;color:#fff;padding:10px 8px;text-align:center;border:1px solid #1e3a5f}
.schedule-table td{border:1px solid #e2e8f0;padding:10px 8px;text-align:center;vertical-align:middle;min-width:100px}
.schedule-table td:first-child{background:#f1f5f9;font-weight:600;color:#475569;width:80px}
.schedule-table td.cell{cursor:pointer;transition:background .2s}
.schedule-table td.cell:hover{background:#dbeafe}
.schedule-table td.cell.has-content{background:#f0f9ff;font-weight:500;color:#1e40af}
.week-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.week-nav button{padding:6px 14px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;cursor:pointer;font-size:13px}
.week-nav button:hover{background:#f1f5f9}
.week-nav .week-label{font-size:15px;font-weight:600;color:#1e2a5a}
/* 值日/护岗表 */
.duty-table{width:100%;border-collapse:collapse;font-size:13px}
.duty-table th{background:#f1f5f9;padding:10px;text-align:center;border:1px solid #e2e8f0;font-weight:600}
.duty-table td{border:1px solid #e2e8f0;padding:10px;text-align:center;vertical-align:top;min-width:120px}
.duty-table td:first-child{background:#f8fafc;font-weight:600;width:80px}
.duty-table .person{display:inline-block;background:#dbeafe;color:#1e40af;padding:3px 10px;border-radius:6px;margin:2px;font-size:12px;cursor:pointer}
.duty-table .person:hover{background:#bfdbfe}
.duty-table .empty-slot{color:#cbd5e1;font-size:12px}
.import-box{background:#f8fafc;border:2px dashed #cbd5e1;border-radius:10px;padding:16px;margin-bottom:14px}
.import-box textarea{width:100%;min-height:80px;border:1px solid #e2e8f0;border-radius:8px;padding:10px;font-size:13px;font-family:inherit;margin-top:8px}

</style>
</head>

function renderTable(){
  const cfg = fieldConfig[currentModule];
  let data = DB.get(currentModule, []);
  const kw = (document.getElementById('searchInput')?.value||'').toLowerCase();
  if(kw){
    data = data.filter(d => Object.values(d).some(v => String(v).toLowerCase().includes(kw)));
  }
  // 按日期倒序
  data.sort((a,b) => (b.date||b.createdAt||'') > (a.date||a.createdAt||'') ? 1 : -1);

  const tbody = document.getElementById('tableBody');
  if(!tbody) return;
  if(data.length === 0){
    tbody.innerHTML = `<tr><td colspan="${cfg.columns.length+1}"><div class="empty"><div class="icon">📭</div>暂无数据，点击右上角"新增"添加</div></td></tr>`;
    return;
  }
  let html = '';
  data.forEach(d => {
    html += '<tr>';
    cfg.columns.forEach(c => {
      let val = d[c.k] || '';
      if(c.tag){
        const cls = tagColors[val] || 'tag-gray';
        val = `<span class="tag ${cls}">${val||'-'}</span>`;
      } else if(c.money){
        val = '¥' + (+val||0).toFixed(2);
      } else if(c.k === 'description' || c.k === 'content'){
        val = String(val).length>30 ? String(val).slice(0,30)+'...' : val;
      }
      html += `<td>${val||'-'}</td>`;
    });
    html += `<td><div class="actions">
      <button class="btn btn-ghost btn-sm" onclick="viewItem('${currentModule}','${d.id}')">查看</button>
      <button class="btn btn-primary btn-sm" onclick="openForm('${currentModule}','${d.id}')">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteItem('${currentModule}','${d.id}')">删除</button>
    </div></td></tr>`;
  });
  tbody.innerHTML = html;
}

function openForm(moduleId, editId){
  const cfg = fieldConfig[moduleId];
  const data = editId ? DB.get(moduleId, []).find(d=>d.id===editId) : {};
  const isEdit = !!editId;

  document.getElementById('modalTitle').textContent = (isEdit?'编辑':'新增') + cfg.title;
  let body = '<form id="dataForm">';
  cfg.fields.forEach(f => {
    const val = data[f.k] !== undefined ? data[f.k] : (f.type==='date'?DB.today():f.type==='datetime'?DB.now():'');
    body += `<div class="form-group"><label>${f.l}${f.req?' *':''}</label>`;
    if(f.type==='select'){
      body += `<select name="${f.k}"><option value="">请选择</option>`;
      f.opts.forEach(o => { body += `<option value="${o}" ${o===val?'selected':''}>${o}</option>`; });
      body += '</select>';
    } else if(f.type==='textarea'){
      body += `<textarea name="${f.k}" placeholder="${f.ph||''}">${val}</textarea>`;
    } else {
      body += `<input type="${f.type}" name="${f.k}" value="${val}" placeholder="${f.ph||''}" ${f.req?'required':''}>`;
    }
    body += '</div>';
  });
  body += '</form>';
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveForm('${moduleId}','${editId||''}')">保存</button>`;
  document.getElementById('modalOverlay').classList.add('show');
}

function saveForm(moduleId, editId){
  const form = document.getElementById('dataForm');
  const cfg = fieldConfig[moduleId];
  const item = {};
  cfg.fields.forEach(f => {
    const el = form.querySelector(`[name="${f.k}"]`);
    item[f.k] = el ? el.value.trim() : '';
  });
  // 必填校验
  for(const f of cfg.fields){
    if(f.req && !item[f.k]){ alert('请填写：'+f.l); return; }
  }
  let data = DB.get(moduleId, []);
  if(editId){
    const idx = data.findIndex(d=>d.id===editId);
    if(idx>=0){ data[idx] = {...data[idx], ...item, updatedAt: DB.now()}; }
  } else {
    item.id = DB.uid();
    item.createdAt = DB.now();
    data.unshift(item);
  }
  DB.set(moduleId, data);
  closeModal();
  renderMain();
}


function importExcel(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1});
      if(rows.length < 2){ alert('Excel至少需要表头和一行数据'); return; }
      // 识别列名
      const headers = rows[0].map(h => String(h||'').trim());
      const colMap = {};
      const nameKeywords = ['姓名','学生姓名','名字'];
      const noKeywords = ['学号','编号','序号'];
      const classKeywords = ['班级','班','年级'];
      const pNameKeywords = ['家长姓名','家长','监护人','父亲','母亲'];
      const pPhoneKeywords = ['家长电话','电话','手机','联系方式','联系电话'];
      headers.forEach((h, i) => {
        if(nameKeywords.some(k=>h.includes(k))) colMap.name = i;
        else if(noKeywords.some(k=>h.includes(k)) && !colMap.studentNo) colMap.studentNo = i;
        else if(classKeywords.some(k=>h.includes(k))) colMap.className = i;
        else if(pNameKeywords.some(k=>h.includes(k))) colMap.parentName = i;
        else if(pPhoneKeywords.some(k=>h.includes(k))) colMap.parentPhone = i;
      });
      if(colMap.name === undefined){ alert('未找到"姓名"列，请检查Excel表头'); return; }
      let data_list = DB.get('students_list', []);
      let count = 0;
      for(let i=1;i<rows.length;i++){
        const row = rows[i];
        if(!row[colMap.name]) continue;
        const item = {
          id: DB.uid(),
          name: String(row[colMap.name]||'').trim(),
          studentNo: colMap.studentNo!==undefined ? String(row[colMap.studentNo]||'').trim() : '',
          className: colMap.className!==undefined ? String(row[colMap.className]||'').trim() : '',
          parentName: colMap.parentName!==undefined ? String(row[colMap.parentName]||'').trim() : '',
          parentPhone: colMap.parentPhone!==undefined ? String(row[colMap.parentPhone]||'').trim() : '',
          note: '',
          createdAt: DB.now()
        };
        if(item.name){ data_list.push(item); count++; }
      }
      DB.set('students_list', data_list);
      alert(`成功从Excel导入 ${count} 名学生！`);
      event.target.value = '';
      renderMain();
    }catch(err){
      alert('Excel解析失败：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function exportSchedule(){
  const sched = DB.get('schedule', null);
  if(!sched){ alert('暂无课表数据'); return; }
  // 构建导出数据
  const aoa = [];
  aoa.push(['浔阳区湖滨小学一年级10班课程表']);
  aoa.push(['节次', ...sched.days]);
  sched.periods.forEach((p, pi) => {
    const row = [p];
    sched.days.forEach(d => { row.push(sched.data[d]?.[pi] || ''); });
    aoa.push(row);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:18},{wch:20},{wch:20},{wch:20},{wch:20},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '课程表');

function exportStudents(){

  data.forEach(s => {

  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:8},{wch:12},{wch:6},{wch:12},{wch:12},{wch:15},{wch:20}];

function importSchedule(){
  const sched = DB.get('schedule', null);
  const text = prompt('粘贴课表数据（每行一节课，用逗号/空格/Tab分隔，依次对应周一~周五）：\n\n示例：\n语文,数学,英语,物理,化学\n数学,语文,物理,化学,英语', '');
  if(text === null || !text.trim()) return;
  const lines = text.trim().split('\n').filter(l=>l.trim());
  let count = 0;
  lines.forEach((line, pi) => {
    if(pi >= sched.periods.length) return;
    const cells = line.split(/[,，\t\s]+/).filter(x=>x.trim());
    sched.days.forEach((d, di) => {
      if(cells[di]){ sched.data[d][pi] = cells[di].trim(); count++; }
    });
  });
  DB.set('schedule', sched);
  alert(`成功导入 ${count} 节课！`);
  renderSchedule(document.getElementById('main'));
}

function editScheduleCell(di, pi){
  const sched = DB.get('schedule', null);
  const day = sched.days[di];
  const period = sched.periods[pi];
  const old = sched.data[day][pi];
  const val = prompt(`编辑 ${day} ${period} 的课程：`, old);
  if(val !== null){
    sched.data[day][pi] = val.trim();
    DB.set('schedule', sched);
    renderSchedule(document.getElementById('main'));
  }
}

function editPeriods(){
  const sched = DB.get('schedule', null);
  const val = prompt('编辑节次（每行一个，格式：节次名 时间）：', sched.periods.join('\n'));
  if(val){
    const periods = val.split('\n').filter(x=>x.trim());
    if(periods.length < 1){ alert('至少需要1个节次'); return; }
    sched.periods = periods;
    sched.days.forEach(d => {
      while(sched.data[d].length < periods.length) sched.data[d].push('');
      sched.data[d] = sched.data[d].slice(0, periods.length);
    });
    DB.set('schedule', sched);
    renderSchedule(document.getElementById('main'));
  }
}

function clearSchedule(){
  if(!confirm('确定清空整个课表吗？')) return;
  const sched = DB.get('schedule', null);
  sched.days.forEach(d => { sched.data[d] = sched.periods.map(()=>''); });
  DB.set('schedule', sched);
  renderSchedule(document.getElementById('main'));
}

// ============ 学生名单导入 ============
function importStudents(){
  const text = document.getElementById('importText').value.trim();
  if(!text){ alert('请先粘贴学生名单'); return; }
  const lines = text.split('\n').filter(l=>l.trim());
  let count = 0;
  let data = DB.get('students_list', []);
  lines.forEach(line => {
    const parts = line.split(/[,，\t\s]+/).filter(x=>x.trim());
    if(parts.length === 0) return;
    const item = {
      id: DB.uid(),
      name: parts[0] || '',
      studentNo: parts[1] || '',
      className: parts[2] || '',
      parentName: parts[3] || '',
      parentPhone: parts[4] || '',
      note: parts[5] || '',
      createdAt: DB.now()
    };
    if(item.name){ data.push(item); count++; }
  });
  DB.set('students_list', data);
  alert(`成功导入 ${count} 名学生`);
  document.getElementById('importText').value = '';
  renderMain();
}

// ============ 学生值日 ============
function renderDuty(main){
  const students = DB.get('students_list', []);
  const config = DB.get('duty_config', {dailyCount: 3, areas: '教室清洁,走廊打扫,黑板擦拭'});

  // 周偏移
  if(typeof dutyWeekOffset === 'undefined') dutyWeekOffset = 0;

  // 计算本周日期范围
  const now = new Date();
  const dayOfWeek = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - dayOfWeek + 1 + dutyWeekOffset * 7);
  const dates = [];
  for(let i=0;i<5;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    dates.push(d.toISOString().slice(5,10));
  }

  // 自动轮值：按学生名单顺序，每天 dailyCount 人
  const days = ['周一','周二','周三','周四','周五'];
  const assignments = {};
  if(students.length > 0){
    const weekStartIdx = (dutyWeekOffset * 5 * config.dailyCount) % students.length;
    days.forEach((day, di) => {
      assignments[day] = [];
      for(let i=0;i<config.dailyCount;i++){
        const idx = (weekStartIdx + di * config.dailyCount + i) % students.length;
        assignments[day].push(students[idx]);
      }
    });
  }

  let html = `<div class="page-head">
    <div><h2>🧹 学生值日</h2><div class="desc">基于学生名单自动轮值，每周循环</div></div>
    <button class="btn btn-primary btn-sm" onclick="editDutyConfig()">值日设置</button>
  </div>`;

  html += `<div class="week-nav">
    <button onclick="dutyWeekOffset--;renderMain()">← 上一周</button>
    <span class="week-label">第 ${dutyWeekOffset>=0?dutyWeekOffset+1:''} 周（${dates[0]} ~ ${dates[4]}）</span>
    <button onclick="dutyWeekOffset++;renderMain()">下一周 →</button>
    <button class="btn btn-ghost btn-sm" onclick="dutyWeekOffset=0;renderMain()">回到本周</button>
  </div>`;

  if(students.length === 0){
    html += '<div class="card"><div class="empty"><div class="icon">👨‍🎓</div>请先在「学生名单」中导入学生信息</div></div>';
  } else {
    html += '<div class="card"><table class="duty-table"><thead><tr><th>日期</th>';
    days.forEach((d,i) => { html += `<th>${d}<br><span style="font-size:11px;color:#94a3b8">${dates[i]}</span></th>`; });
    html += '</tr></thead><tbody><tr><td>值日学生</td>';
    days.forEach(d => {
      html += '<td>';
      (assignments[d]||[]).forEach(s => {
        html += `<span class="person" title="家长：${s.parentName||'-'} ${s.parentPhone||''}">${s.name}</span>`;
      });
      html += '</td>';
    });
    html += '</tr><tr><td>值日区域</td>';
    const areas = (config.areas||'').split(/[,，]/).filter(x=>x.trim());
    days.forEach(() => {
      html += '<td style="font-size:12px;color:#64748b">' + areas.join('、') + '</td>';
    });
    html += '</tr></tbody></table></div>';
  }
  main.innerHTML = html;
}

function editDutyConfig(){
  const config = DB.get('duty_config', {dailyCount: 3, areas: '教室清洁,走廊打扫,黑板擦拭'});
  const count = prompt('每天值日人数：', config.dailyCount);
  if(count === null) return;
  const areas = prompt('值日区域（逗号分隔）：', config.areas);
  if(areas === null) return;
  config.dailyCount = parseInt(count) || 3;
  config.areas = areas;
  DB.set('duty_config', config);
  renderMain();
}

// ============ 导入导出 ============
function exportData(moduleId){
  const data = DB.get(moduleId, []);
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `家委会_${fieldConfig[moduleId].title}_${DB.today()}.json`;
  a.click();
}

function exportAll(){
  const all = {};
  modules.forEach(m => { if(m.id!=='dashboard'&&m.id!=='settings') all[m.id] = DB.get(m.id,[]); });
  all._exportTime = DB.now();
  const blob = new Blob([JSON.stringify(all,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `家委会工作台_全部数据_${DB.today()}.json`;
  a.click();
}

function importAll(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const data = JSON.parse(ev.target.result);
        if(!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
        Object.keys(data).forEach(k => { if(k!=='_exportTime') DB.set(k, data[k]); });
        alert('导入成功！');
        renderMain();
      }catch(err){ alert('导入失败：文件格式错误'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearAll(){
  if(!confirm('确定清空所有数据吗？此操作不可恢复！建议先导出备份。')) return;
  if(!confirm('再次确认：真的要清空所有数据吗？')) return;
  modules.forEach(m => { if(m.id!=='dashboard'&&m.id!=='settings') DB.set(m.id, []); });
  alert('数据已清空');
  renderMain();
}
